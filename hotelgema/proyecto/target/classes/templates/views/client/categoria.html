<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/main/main.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <header class="fixed-top header">
        <div th:insert="~{fragments/layouts/header :: header}"></div>
    </header>
    <section class="categoria section__categoria">
        <div class="categoria__banner">
            <h2 class="text-center"
                th:text="${nombre != null and !#strings.isEmpty(nombre) ? 'Habitación - ' + nombre : 'Nuestras habitaciones'}">
            </h2>
        </div>
        <div class="container" style="padding-top: 8rem;">
            <div th:each="categoria : ${listaCategoria}"
                class="row mb-5 align-items-center shadow rounded bg-white p-4">
                <div class="col-md-5">
                    <img th:src="${categoria.imagenUrl}" class="img-fluid rounded"
                        alt="Imagen de habitación">

                </div>

                <!-- Detalles -->
                <div class="col-md-7">
                    <h2 th:text="${categoria.nombre}" class="fw-bold"></h2>
                    <p th:text="${categoria.descripcion}" class="text-muted"></p>
                    <p class="fs-4 fw-semibold text-success">
                        desde S/ <span th:text="${categoria.precio} + ' por noche'"></span>
                    </p>

                    <!-- Lista de beneficios dinámica -->
                    <h5 class="mt-3">Beneficios:</h5>
                    <ul class="list-group list-group-flush">
                        <li th:each="beneficio : ${categoria.beneficiosLista}" th:text="${beneficio}"
                            class="list-group-item">
                        </li>
                    </ul>

                    <h6 class="mt-3">Capacidad:</h5>
                        <p class="categoria__text__capacidad" th:text="'Hasta '+ ${categoria.aforo + ' personas'}"></p>

                        <a href="#" class="btn btn-dark mt-3 btn__reservar"
                            th:attr="data-habitacion=${categoria.nombre}, data-precio=${categoria.precio}">
                            Reservar ahora
                        </a>
                </div>
            </div>
        </div>

    </section>

    <footer class="footer">
        <div th:insert="~{fragments/layouts/footer :: footer}"></div>
    </footer>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/client/reserva.js}"></script>
    <script th:src="@{/js/main/main.js}"></script>
</body>

</html>
