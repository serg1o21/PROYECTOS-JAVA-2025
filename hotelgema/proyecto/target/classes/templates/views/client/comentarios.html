<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Comentarios</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/main/main.css}" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="fixed-top header">
      <div th:insert="~{fragments/layouts/header :: header}"></div>
    </header>
    <section>
      <div class="comentarios__banner">
        <h2 class="text-center">Comentarios de clientes</h2>
      </div>
      <div class="container mt-4 py-4">
        <div class="row g-4">
          <div
            class="col-12 col-sm-6 col-lg-4"
            th:each="comentario : ${listaComentarios}"
          >
            <div class="card h-100 shadow-lg border-0 rounded-3">
              <img
                th:if="${comentario.urlImg != null}"
                th:src="${comentario.urlImg}"
                class="card-img-top"
                alt="Imagen comentario"
                style="
                  height: 200px;
                  object-fit: cover;
                  border-top-left-radius: 1rem;
                  border-top-right-radius: 1rem;
                "
              />
              <div class="card-body">
                <h5 class="card-title" th:text="${comentario.titulo}"></h5>
                <p
                  class="card-text text-muted"
                  th:text="${comentario.descripcion}"
                ></p>
              </div>
      
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div th:insert="~{fragments/layouts/footer :: footer}"></div>
    </footer>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
