<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard administrador</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/main/main.css}" rel="stylesheet" />
    <link th:href="@{/css/admin/dashboard.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>

<body class="bg-white">

    <header class="fixed-top header">
        <div <div th:insert="~{fragments/layouts/header :: header}"></div>
    </header>

    <section class="section__admin__dashboard">
        <div class="dashboard__admin__banner">
            <h2 class="text-center" th:text="'PANEL ADMINISTRATIVO'">
            </h2>
        </div>

     <div class="menu__dashboard container min-vh-100 d-flex flex-column justify-content-center align-items-center">
    <div class="row justify-content-center align-items-center g-3">
        <h3 class="text-center w-100 mb-4">ACCESO RÁPIDO</h3>

        <div class="col-md-4 col-sm-6 mb-3">
            <a th:href="@{/admin/mantenimiento/habitacion}" class="text-decoration-none d-block">
                <div class="card text-center shadow-sm">
                    <div class="cardheader">
                        <i class="fa-solid fa-bed fa-2x"></i>
                    </div>
                    <div class="card-body">
                        <h4 class="text-dark">Habitaciones</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4 col-sm-6 mb-3">
            <a th:href="@{/admin/mantenimiento/categoria}" class="text-decoration-none d-block">
                <div class="card text-center shadow-sm">
                    <div class="cardheader">
                        <i class="fa-solid fa-tags fa-2x"></i>
                    </div>
                    <div class="card-body">
                        <h4 class="text-dark">Categorías</h4>
                    </div>
                </div>
            </a>
        </div>



        <div class="col-md-4 col-sm-6 mb-3">
            <a th:href="@{/admin/mantenimiento/reserva}" class="text-decoration-none d-block">
                <div class="card text-center shadow-sm">
                    <div class="cardheader">
                        <i class="fa-solid fa-calendar-check fa-2x"></i>
                    </div>
                    <div class="card-body">
                        <h4 class="text-dark">Reservas</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4 col-sm-6 mb-3">
            <a th:href="@{/admin/mantenimiento/usuario}" class="text-decoration-none d-block">
                <div class="card text-center shadow-sm">
                    <div class="cardheader">
                        <i class="fa-solid fa-users fa-2x"></i>
                    </div>
                    <div class="card-body">
                        <h4 class="text-dark">Usuarios</h4>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>



    </section>

    <footer class="footer">
        <div th:insert="~{fragments/layouts/footer :: footer}"></div>
    </footer>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main/main.js}"></script>
    <script th:src="@{/js/admin/categoria.js}"></script>

</body>

</html>
